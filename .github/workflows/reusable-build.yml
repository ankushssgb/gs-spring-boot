name: Reusable Java Maven Build Worflow

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '17'
      sonar-scan:
        required: false
        type: boolean
        default: false

jobs:
  reusable-maven-build:
    name: Execute Reusable Java Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Build and test
        run: |
          cd complete
          mvn -B clean verify

      - name: Optional SonarCloud analysis
        if: inputs.sonar-scan == true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd complete
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
