name: Reusable Java Maven Build Worflow

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '17'
      sonar-scan:
        required: false
        type: boolean
        default: false

jobs:
  reusable-maven-build:
    name: Execute Reusable Java Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Build and test
        run: |
          cd complete
          mvn -B clean verify

      - name: Optional SonarCloud analysis
        if: inputs.sonar-scan == true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd complete
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./complete
          file: ./complete/Dockerfile
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/springboot-demo-app:latest
            ${{ secrets.DOCKER_USERNAME }}/springboot-demo-app:${{ github.sha }}

      - name: Verify Docker image
        run: docker images

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/springboot-demo-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/springboot-demo-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/springboot-demo-app:${{ github.sha }}
      
