name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/*'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/springboot-demo-app

jobs:
  build-test-analyze-package:
    name: Build, Test, Analyze, and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: |
          cd complete
          mvn -B clean verify

      - name: Static code analysis
        run: |
          cd complete
          mvn -B -q -DskipTests org.apache.maven.plugins:maven-checkstyle-plugin:3.2.4:check
          mvn -B -q -DskipTests org.apache.maven.plugins:maven-pmd-plugin:3.20.0:check
          mvn -B -q -DskipTests com.github.spotbugs:spotbugs-maven-plugin:4.7.3:check

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v5
        with:
          context: ./complete
          file: ./complete/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Docker image (feature branch)
        if: startsWith(github.ref, 'refs/heads/feature/')
        uses: docker/build-push-action@v5
        with:
          context: ./complete
          file: ./complete/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          vuln-type: os,library
